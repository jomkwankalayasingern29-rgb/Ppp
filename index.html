<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPT SHOP - ร้านขายสคริปต์</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 50px; }
        
        .header { background: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #cbd5e1; }
        .logo { font-size: 20px; font-weight: bold; color: #2563eb; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        
        .title-box { background: #ffffff; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .title-box h1 { font-size: 22px; color: #0f172a; margin-bottom: 5px; }
        .title-box p { font-size: 14px; color: #64748b; }
        
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-card { background: #ffffff; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .product-img { width: 100%; height: 120px; background: #3b82f6; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 8px; }
        .product-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .product-price { color: #2563eb; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        .btn { background: #2563eb; color: white; border: none; padding: 8px 0; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ SCRIPT SHOP</div>
        <div>🔍</div>
    </div>

    <div class="container">
        
        <!-- หมวดหมู่รันสคริปต์ -->
        <div class="title-box">
            <h1>🚀 บริการรับรันสคริปต์</h1>
            <p>เลือกซื้อสคริปต์เกมและบริการที่คุณต้องการได้เลย</p>
        </div>

        <!-- รายการสินค้า -->
        <div class="product-grid">

            <div class="product-card">
                <div class="product-img">Blox Fruits</div>
                <div class="product-name">📜 สคริปต์ Blox Fruits</div>
                <div class="product-price">50 บาท</div>
                <button class="btn" onclick="alert('สั่งซื้อสคริปต์ Blox Fruits')">ซื้อสคริปต์</button>
            </div>

            <div class="product-card">
                <div class="product-img">Grow Garden</div>
                <div class="product-name">📜 สคริปต์ Grow Garden</div>
                <div class="product-price">30 บาท</div>
                <button class="btn" onclick="alert('สั่งซื้อสคริปต์ Grow Garden')">ซื้อสคริปต์</button>
            </div>

        </div>

    </div>

</body>
</html>
