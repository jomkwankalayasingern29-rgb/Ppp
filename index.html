<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPT SHOP</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            font-family: 'Kanit', sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
        }
        /* Navbar */
        .navbar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #dc3545;
        }
        .navbar-brand {
            font-weight: 600;
            color: #dc3545 !important;
        }
        .user-badge {
            background-color: #2a2a2a;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 14px;
        }
        .credit-badge {
            background-color: #ffc107;
            color: #000;
            font-weight: bold;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
        }
        /* Banner Header */
        .header-banner {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid #333;
            margin-bottom: 30px;
        }
        /* Product Card */
        .card-script {
            background-color: #1e1e1e;
            border: 1px solid #dc3545;
            border-radius: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-script:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }
        .card-body-content {
            background-color: #0a0a0a;
            border-radius: 8px;
            padding: 40px 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .btn-buy {
            background-color: #dc3545;
            color: white;
            font-weight: 600;
            border: none;
            width: 100%;
        }
        .btn-buy:hover {
            background-color: #bb2d3b;
            color: white;
        }
        /* Modal Custom */
        .modal-content {
            background-color: #ffffff;
            color: #333;
            border-radius: 16px;
        }
        .modal-header {
            border-bottom: none;
        }
        .btn-topup {
            background-color: #10b981;
            color: white;
            font-weight: 600;
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
        }
        .btn-topup:hover {
            background-color: #059669;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar Top -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 px-3">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-rocket me-2"></i>SCRIPT SHOP</a>
            <div class="d-flex align-items-center gap-2">
                <span class="user-badge"><i class="fa-solid fa-user me-1"></i> <span id="username">Opop</span></span>
                <span class="credit-badge" data-bs-toggle="modal" data-bs-target="#topupModal">
                    <i class="fa-solid fa-sack-dollar me-1"></i> <span id="creditBalance">999.00</span> ฿
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Banner -->
        <div class="header-banner">
            <h3>🚀 บริการรับรันสคริปต์</h3>
            <p class="text-secondary m-0">เลือกซื้อสคริปต์ Roblox คุณภาพสูง ได้ที่นี่</p>
        </div>

        <!-- Script List Grid -->
        <div class="row g-4">
            <!-- Item 1 -->
            <div class="col-md-6 col-lg-3">
                <div class="card card-script p-3">
                    <div class="card-body-content">
                        <h5 class="text-light">Universal Script</h5>
                    </div>
                    <div class="text-center mb-3">
                        <small class="text-secondary"><i class="fa-solid fa-box-archive me-1"></i>สคริปต์ใช้ได้ทุกแมพ</small>
                        <h4 class="text-danger mt-1">99 บาท</h4>
                    </div>
                    <button class="btn btn-buy py-2" onclick="buyScript('Universal Script', 99)">ซื้อสคริปต์</button>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="col-md-6 col-lg-3">
                <div class="card card-script p-3">
                    <div class="card-body-content">
                        <h5 class="text-light">ESP / Wallhack</h5>
                    </div>
                    <div class="text-center mb-3">
                        <small class="text-secondary"><i class="fa-solid fa-box-archive me-1"></i>สคริปต์ ESP มองทะลุ</small>
                        <h4 class="text-danger mt-1">35 บาท</h4>
                    </div>
                    <button class="btn btn-buy py-2" onclick="buyScript('ESP / Wallhack', 35)">ซื้อสคริปต์</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal เติมเงินซองอั่งเปา -->
    <div class="modal fade" id="topupModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-3">
                <div class="modal-header d-flex flex-column align-items-center pb-0">
                    <h4 class="modal-title fw-bold text-dark">🧧 เติมเงินซองอั่งเปา</h4>
                    <small class="text-muted">ระบบจะโอนเงินเข้าเบอร์ <b>0827525423</b> แล้วเพิ่มเครดิตทันที</small>
                </div>
                <div class="modal-body">
                    <div class="mb-3 text-start">
                        <input type="text" id="giftLink" class="form-control form-control-lg" placeholder="วางลิงก์ซองอั่งเปา TrueMoney ที่นี่..." required>
                    </div>

                    <!-- ปุ่มตรวจสอบ & เติมเงิน (ไม่มีช่องใส่ตัวเลข 999 แล้ว) -->
                    <button type="button" class="btn btn-topup w-100 mb-2" onclick="submitTopup()">ตรวจสอบ & เติมเงิน</button>
                    <button type="button" class="btn btn-link text-danger text-decoration-none" data-bs-dismiss="modal">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script ทำงานหลังบ้าน -->
    <script>
        async function submitTopup() {
            const giftLink = document.getElementById('giftLink').value.trim();

            if (!giftLink) {
                Swal.fire({
                    icon: 'warning',
                    title: 'แจ้งเตือน',
                    text: 'กรุณาวางลิงก์ซองอั่งเปาด้วยครับ',
                    confirmButtonColor: '#dc3545'
                });
                return;
            }

            // แสดงหน้ากำลังโหลด
            Swal.fire({
                title: 'กำลังตรวจสอบ...',
                text: 'ระบบกำลังดึงเงินจากซองอั่งเปา กรุณารอสักครู่',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                // ส่งค่าไปดึงเงินที่ api_topup.php
                const response = await fetch('api_topup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ giftLink: giftLink })
                });

                const result = await response.json();

                if (result.status) {
                    Swal.fire({
                        icon: 'success',
                        title: 'เติมเงินสำเร็จ!',
                        text: `ระบบได้รับเงินจำนวน ${result.amount} บาท และเพิ่มเครดิตเรียบร้อยแล้ว`,
                        confirmButtonColor: '#10b981'
                    }).then(() => {
                        // อัปเดตยอดเงินบนหน้าเว็บทันที
                        let currentCredit = parseFloat(document.getElementById('creditBalance').innerText);
                        let newCredit = currentCredit + parseFloat(result.amount);
                        document.getElementById('creditBalance').innerText = newCredit.toFixed(2);
                        
                        // ปิด Modal และเคลียร์ช่องกรอก
                        document.getElementById('giftLink').value = '';
                        const modal = bootstrap.Modal.getInstance(document.getElementById('topupModal'));
                        modal.hide();
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'เติมเงินไม่สำเร็จ',
                        text: result.message || 'เกิดข้อผิดพลาดในการเติมเงิน',
                        confirmButtonColor: '#dc3545'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด',
                    text: 'ไม่สามารถเชื่อมต่อกับระบบเติมเงินได้',
                    confirmButtonColor: '#dc3545'
                });
            }
        }

        function buyScript(name, price) {
            let currentCredit = parseFloat(document.getElementById('creditBalance').innerText);
            if (currentCredit >= price) {
                Swal.fire({
                    icon: 'success',
                    title: 'สั่งซื้อสำเร็จ!',
                    text: `คุณได้ทำการซื้อ ${name} เรียบร้อยแล้ว`,
                    confirmButtonColor: '#10b981'
                }).then(() => {
                    document.getElementById('creditBalance').innerText = (currentCredit - price).toFixed(2);
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'เครดิตไม่พอ',
                    text: 'กรุณาเติมเงินก่อนทำรายการสั่งซื้อ',
                    confirmButtonColor: '#dc3545'
                });
            }
        }
    </script>
</body>
</html>
